name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# CI 는 빌드·타입체크·임포트 검증만 수행한다.
# artifact 업로드 금지 (리소스 정책) — 릴리즈 파이프라인에서만 업로드.
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # wire 타입(src/lib/contract.gen.ts)은 서버 계약(server/openapi/u-vision.json)에서 생성해 커밋한다 — 계약을 바꾸고
      # 다시 생성하지 않았으면 여기서 멈춘다.
      - run: npm run generate:types
      - name: Wire types match the contract
        run: |
          changes=$(git status --porcelain -- src/lib/contract.gen.ts)
          if [ -n "$changes" ]; then
            echo "::error::client/src/lib/contract.gen.ts is stale - run 'npm run generate:types' in client/ and commit the result"
            echo "$changes"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # 서버 패키지에 담기는 임베드 클라(server/src/UVision.Hosting/wwwroot)는 커밋된 산출물이다 — 이 소스로 다시 구운
      # 결과와 같아야 한다. 클라를 고치고 build:embed 를 돌리지 않았으면 여기서 멈춘다.
      - run: npm run build:embed
      - name: Embedded client matches the source
        run: |
          changes=$(git status --porcelain -- ../server/src/UVision.Hosting/wwwroot)
          if [ -n "$changes" ]; then
            echo "::error::server/src/UVision.Hosting/wwwroot is stale - run 'npm run build:embed' in client/ and commit the result"
            echo "$changes"
            exit 1
          fi

  # 엔진 컨테이너 이미지 — push 마다 지어지는지 보고, v* 태그에서만 GHCR 에 게시한다(태그 push 가 곧 게시 = 사람 게이트).
  # 판은 git 태그: v0.4.0 → 0.4.0 · 0.4 · latest. linux/amd64 · linux/arm64 한 매니페스트 — SDK 는 러너 아키에서 교차
  # publish 하고(Dockerfile), 최종 단계의 RUN 만 arm64 에뮬레이션(QEMU)으로 돈다.
  # client · server 검사가 모두 통과한 뒤에만 돈다 — 태그에서 검사가 깨졌는데 이미지만 게시되는 일이 없게.
  image:
    needs: [client, server]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/u-vision
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=U-Vision
            org.opencontainers.image.description=Self-hosted vision judgment engine (PWA and API in one process)
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # NuGet 캐시 — lock 파일 부재 시 csproj 해시, restore-keys OS prefix fallback
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet restore UVision.slnx
      # 판은 git 태그다 — 이미지는 태그에서 판을 읽고 nuget 패키지는 csproj 의 Version 을 쓰므로, 둘이 어긋난 태그는
      # 여기서 멈춘다(판 상승 커밋 없이 태그만 찍으면 이미지 0.4.0 · 패키지 0.3.0 이 함께 나간다).
      - name: Tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for project in src/UVision.Hosting/UVision.Hosting.csproj src/UVision.Client/UVision.Client.csproj; do
            version=$(dotnet msbuild "$project" -getProperty:Version)
            if [ "$version" != "$tag" ]; then
              echo "::error::$project has Version $version but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: dotnet build UVision.slnx --no-restore --configuration Release
      - run: dotnet test UVision.slnx --no-build --configuration Release
      # samples/ClientIntegration 은 패키지만 참조한다 — 이 커밋의 UVision.Client 를 임시 피드로 묶어 그 위에서 짓는다.
      # 판을 올리고 예제의 Version 을 따라 올리지 않으면 restore 가 여기서 멈춘다.
      - name: Samples build against this commit's packages
        run: |
          dotnet pack src/UVision.Client/UVision.Client.csproj --no-build -c Release -o "$RUNNER_TEMP/feed"
          dotnet build ../samples/ClientIntegration -c Release -p:RestoreAdditionalProjectSources="$RUNNER_TEMP/feed"
      # UVision.Client 의 Generated/ 는 계약 문서(openapi/u-vision.json)에서 Kiota 로 만든 커밋된 산출물이다 — 다시
      # 생성한 결과와 같아야 한다. 계약을 바꾸고 생성기를 돌리지 않았으면 여기서 멈춘다.
      - run: dotnet tool restore
      - name: Generated client matches the contract
        run: |
          dotnet run scripts/generate-client.cs
          changes=$(git status --porcelain -- src/UVision.Client/Generated)
          if [ -n "$changes" ]; then
            echo "::error::server/src/UVision.Client/Generated is stale - run 'dotnet run scripts/generate-client.cs' in server/ and commit the result"
            echo "$changes"
            exit 1
          fi

  # nuget 게시 — v* 태그에서만, client · server 검사가 모두 통과한 뒤(UVision.Hosting 은 client 잡이 대조하는 임베드
  # 클라를 싣는다).
  nuget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [client, server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Pack & Push UVision.Hosting · UVision.Client
        run: |
          dotnet pack src/UVision.Hosting/UVision.Hosting.csproj -c Release -o ${{ runner.temp }}/nupkg
          dotnet pack src/UVision.Client/UVision.Client.csproj -c Release -o ${{ runner.temp }}/nupkg
          dotnet nuget push "${{ runner.temp }}/nupkg/*.nupkg" -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
