# The host's reverse proxy puts U-Vision under its own origin: the host keeps every other path, and
# /u-vision/ (screens) and /api/u-vision/ (API) go to the engine server unchanged. The paths are
# passed through as they are — the engine already serves under them, and the PWA build is baked to
# /u-vision/ — so no prefix is stripped or rewritten.
server {
    listen 80;
    # Redirects stay relative, so they keep whatever port and scheme the client used.
    absolute_redirect off;

    # Inspection uploads: the engine's own limit (MAX_UPLOAD_SIZE_MB, default 10) must be the one that
    # answers, so the proxy allows a little more than it.
    client_max_body_size 12m;

    # The host application's own pages. In a real deployment this is the host (MES, portal, ...).
    location / {
        default_type text/plain;
        return 200 "host application\n";
    }

    location = /u-vision {
        return 301 /u-vision/;
    }

    location /u-vision/ {
        proxy_pass http://engine:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/u-vision/ {
        proxy_pass http://engine:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A verdict can take as long as the vision model does.
        proxy_read_timeout 120s;
    }
}
