<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>hero</title>
<link rel="stylesheet" href="../studio.css" />
<style>
  /* The video is the screen alone; the site draws the tablet around it. */
  #shot { position: relative; width: 1600px; height: 1000px; overflow: hidden; background: #000; }
  #feed, #scratch { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; }
  #shade { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  #flash { position: absolute; inset: 0; z-index: 8; background: #fff; opacity: 0; }
  #roi { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; }
  #busy, #ng, #ok { opacity: 0; }
  .verdict { transform-origin: 50% 100%; }
  .status .dot { transition: none; }
</style>
</head>
<body>
<div id="shot">
  <img id="feed" src="../assets/flange.webp" alt="" />
  <svg id="scratch" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M 963 392 Q 978 412 996 446" stroke="rgb(30 30 34 / 0.35)" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 962 390 Q 977 410 995 444" stroke="rgb(255 255 255 / 0.7)" stroke-width="1.6" fill="none" stroke-linecap="round" />
  </svg>
  <div id="shade"></div>
  <svg id="roi" viewBox="0 0 1600 1000" aria-hidden="true">
    <!-- the client's ROI overlay: an emerald rectangle with the outside dimmed -->
    <path fill="rgb(0 0 0 / 0.35)" fill-rule="evenodd" d="M 0 0 H 1600 V 1000 H 0 Z M 470 236 H 1130 V 834 H 470 Z" />
    <rect x="470" y="236" width="660" height="598" rx="9" fill="none" stroke="rgb(52 211 153 / 0.9)" stroke-width="3" />
  </svg>
  <div class="topbar left">
    <span class="pill status"><span class="dot" id="sdot"></span><span id="stext"></span></span>
  </div>
  <div class="topbar">
    <span class="pill">자동</span>
    <span class="pill ghost">2번 태블릿</span>
    <span class="pill">플랜지 외관 검사 ▾</span>
    <span class="pill">오늘 이력</span>
    <span class="pill">관리</span>
  </div>
  <div class="recent"><div class="h">최근</div><ul id="recent"></ul></div>
  <div class="verdict-wrap"><div class="verdict busy" id="busy"></div></div>
  <div class="verdict-wrap">
    <div class="verdict ng" id="ng">
      <div class="big">NG</div>
      <p class="finding">2시 방향 볼트 구멍 사이 면에 길이 약 6mm 의 선형 긁힘</p>
      <p class="conf">신뢰도 94%</p>
    </div>
  </div>
  <div class="verdict-wrap">
    <div class="verdict ok" id="ok">
      <div class="big">OK</div>
      <p class="conf">신뢰도 97%</p>
    </div>
  </div>
  <div id="flash"></div>
</div>
<script>
  // One loop of the operator screen, as a pure function of time: seek(t) draws the frame at t seconds, so the
  // capture script can step through it frame by frame and every render is the same.
  const DURATION = 16;
  const $ = (id) => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ramp = (t, a, b) => clamp((t - a) / (b - a));
  const ease = (x) => x * x * (3 - 2 * x);

  // Each item: arrives (motion), settles, holds still, is shot, judged, shown, then leaves.
  const ITEMS = [
    { start: 0, scratch: true, verdict: 'ng', offset: [0, 0] },
    { start: 8, scratch: false, verdict: 'ok', offset: [-18, 10] },
  ];
  const P = { arrive: 1.4, settle: 0.6, still: 0.6, capture: 0.4, judge: 1.5, show: 2.6, leave: 0.9 };

  function phaseOf(t) {
    for (const item of ITEMS) {
      const local = t - item.start;
      if (local < 0 || local >= 8) continue;
      let at = 0;
      for (const [name, len] of Object.entries(P)) {
        if (local < at + len) return { item, name, p: (local - at) / len, local };
        at += len;
      }
      return { item, name: 'leave', p: 1, local };
    }
    return { item: ITEMS[0], name: 'arrive', p: 0, local: 0 };
  }

  function seek(t) {
    t = ((t % DURATION) + DURATION) % DURATION;
    const { item, name, p } = phaseOf(t);
    const done = ITEMS.indexOf(item) + (['show', 'leave'].includes(name) ? 1 : 0);

    // camera feed: blurred and shaking while a hand moves the part, sharp once it holds still
    let blur = 0, dx = item.offset[0], dy = item.offset[1], shadow = 0;
    if (name === 'arrive') {
      const k = 1 - ease(p);
      blur = 10 * k + 2;
      dx += Math.sin(p * 17) * 26 * k;
      dy += 60 * k + Math.cos(p * 13) * 14 * k;
      shadow = 0.55 * k + 0.1;
    } else if (name === 'settle') {
      const k = 1 - ease(p);
      blur = 2 * k;
      dx += Math.sin(p * 20) * 4 * k;
      shadow = 0.1 * k;
    } else if (name === 'leave') {
      const k = ease(p);
      blur = 12 * k;
      dx += Math.sin(p * 15) * 30 * k;
      dy -= 80 * k;
      shadow = 0.6 * k;
    }
    const feed = $('feed'), scratch = $('scratch');
    for (const el of [feed, scratch]) {
      el.style.filter = `blur(${blur.toFixed(2)}px)`;
      el.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    }
    scratch.style.opacity = item.scratch ? 1 : 0;
    $('shade').style.background = `linear-gradient(160deg, rgb(10 12 16 / ${shadow.toFixed(3)}) 0%, rgb(10 12 16 / ${(shadow * 0.4).toFixed(3)}) 55%, transparent 100%)`;

    // status pill: moving → holding still → shot
    const moving = name === 'arrive' || name === 'settle' || name === 'leave';
    // the client's own status labels
    $('stext').textContent = moving ? '움직임 감지 중' : name === 'still' ? '정지 — 검사' : '검사 중…';
    $('sdot').style.background = moving ? '#fbbf24' : name === 'still' ? '#34d399' : '#38bdf8';

    // the recent strip gains each verdict as it is shown
    const shown = [['ok', 'OK', '14:01:20'], ['ok', 'OK', '14:01:37'], ['ok', 'OK', '14:01:52']];
    if (done >= 1) shown.push(['ng', 'NG', '14:02:19']);
    if (done >= 2) shown.push(['ok', 'OK', '14:02:27']);
    const rows = shown.slice(-4).reverse().map(([c, v, t]) => `<li><span class="${c}">${v}</span><span class="t">${t}</span></li>`).join('');
    if ($('recent').innerHTML !== rows) $('recent').innerHTML = rows;

    // shutter flash
    $('flash').style.opacity = name === 'capture' ? (0.55 * (1 - ease(p))).toFixed(3) : 0;

    // busy badge
    const busy = $('busy');
    if (name === 'capture' || name === 'judge') {
      busy.textContent = name === 'capture' ? '캡처 중…' : '판정 중…';
      busy.style.opacity = name === 'capture' ? ease(p) : 1;
    } else busy.style.opacity = 0;

    // verdict card: rises in, holds, fades as the next part arrives
    for (const id of ['ng', 'ok']) {
      const el = $(id);
      let o = 0, s = 0.92;
      if (item.verdict === id && name === 'show') { const k = ease(clamp(p * 6)); o = k; s = 0.92 + 0.08 * k; }
      if (item.verdict === id && name === 'leave') { o = 1 - ease(clamp(p * 2)); s = 1; }
      el.style.opacity = o.toFixed(3);
      el.style.transform = `scale(${s.toFixed(3)})`;
    }
  }

  window.DURATION = DURATION;
  window.seek = seek;
  seek(Number(new URLSearchParams(location.search).get('t') ?? 6));
</script>
</body>
</html>
