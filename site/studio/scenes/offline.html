<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>offline</title>
<link rel="stylesheet" href="../studio.css" />
<style>
  #shot { width: 1500px; height: 980px; }
  .screen { width: 100%; height: 100%; }
  .feed.dim { filter: saturate(0.85); }
  /* the client's late-verdict alert: a verdict that came back after waiting in the queue, NG kept in view until confirmed */
  .late-alert { position: absolute; inset-inline: 0; top: 168px; z-index: 6; display: flex; justify-content: center; }
  .late-alert > div { display: flex; align-items: center; gap: 18px; border-radius: 14px; background: rgb(220 38 38 / 0.95); padding: 13px 22px; color: #fff; font-size: 16px; font-weight: 600; box-shadow: 0 10px 30px rgb(0 0 0 / 0.35); }
  .late-alert button { border: 0; border-radius: 999px; background: #fff; color: #b91c1c; padding: 5px 18px; font: inherit; font-size: 15px; }
</style>
</head>
<body>
<div id="shot" class="device">
  <div class="screen">
    <img class="feed dim" src="../assets/flange.webp" alt="" />
    <div class="topbar left stack">
      <span class="pill"><span class="dot" style="background:#fbbf24"></span>움직임 감지 중</span>
      <span class="pill" style="background:rgb(51 65 85 / 0.9)">판정 대기 3건</span>
    </div>
    <div class="verdict-wrap">
      <div class="verdict queued">
        <div style="font-size:24px;font-weight:700">오프라인 — 캡처 저장됨</div>
        <div style="margin-top:6px;font-size:16px;color:rgb(255 255 255 / 0.82)">연결되면 자동으로 판정합니다. 다음 품목을 계속하세요.</div>
      </div>
    </div>
    <div class="late-alert"><div>대기했다 판정된 NG 1건 — 촬영 오후 2:28:47<button>확인</button></div></div>
    <div class="recent"><div class="h">최근</div><ul><li><span class="ok">OK<span class="late">지연</span></span><span class="t">14:29:12</span></li><li><span class="ng">NG<span class="late">지연</span></span><span class="t">14:28:47</span></li><li><span class="ok">OK</span><span class="t">14:26:03</span></li><li><span class="ok">OK</span><span class="t">14:25:40</span></li></ul></div>
  </div>
</div>
</body>
</html>
