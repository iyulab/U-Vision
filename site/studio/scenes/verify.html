<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>verify</title>
<link rel="stylesheet" href="../studio.css" />
<style>
  #shot { width: 1500px; height: 980px; }
  .screen { width: 100%; height: 100%; }
  .read { font-size: 16px; color: rgb(255 255 255 / 0.85); margin-top: 10px; }
</style>
</head>
<body>
<div id="shot" class="device">
  <div class="screen">
    <img class="feed" src="../assets/housing.webp" alt="" />
    <svg class="feed" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g id="label" transform="translate(560 382)">
        <g id="bars" fill="#1b1d22"></g>
        <text x="215" y="215" text-anchor="middle" font-family="Consolas, monospace" font-size="38" font-weight="700" fill="#1b1d22" letter-spacing="3">HS-2210-B</text>
        <text x="215" y="252" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#4b5058">LOT 26-1022-07</text>
      </g>
      <rect x="498" y="322" width="556" height="332" rx="10" fill="none" stroke="#10b981" stroke-width="5" />
    </svg>
    <div class="topbar left">
      <span class="pill"><span class="dot" style="background:#34d399"></span>정지 — 검사</span>
    </div>
    <div class="topbar">
      <span class="pill">자동</span>
      <span class="pill amber">HS-2210-B</span>
      <span class="pill ghost">출하 검사대</span>
      <span class="pill">하우징 오투입 확인 ▾</span>
      <span class="pill">오늘 이력</span>
      <span class="pill">관리</span>
    </div>
    <div class="verdict-wrap">
      <div class="verdict ok">
        <div class="big">일치</div>
        <p class="read">장치가 읽은 코드 HS-2210-B</p>
        <p class="conf">코드 대조로 확정</p>
      </div>
    </div>
  </div>
</div>
<script>
  // A code-128-looking bar pattern, fixed so every capture is the same.
  const g = document.getElementById('bars');
  const widths = [3,1,2,1,1,3,2,1,1,2,3,1,1,1,2,2,1,3,1,2,1,1,3,2,2,1,1,3,1,2,2,1,1,1,3,1,2,3,1,1,2,1,1,2,3,1,1,2,1,3,2,1,1,2];
  // scaled to fill the label's printable width
  const unit = 400 / widths.reduce((a, b) => a + b, 0);
  let x = 15, bar = true;
  for (const w of widths) {
    const px = w * unit;
    if (bar) { const r = document.createElementNS('http://www.w3.org/2000/svg','rect'); r.setAttribute('x', x); r.setAttribute('y', 30); r.setAttribute('width', px); r.setAttribute('height', 140); g.appendChild(r); }
    x += px; bar = !bar;
  }
</script>
</body>
</html>
